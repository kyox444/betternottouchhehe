.panel{
  position:relative; z-index:1; padding:22px 20px 20px; border-radius:22px;
  background:color-mix(in srgb,var(--card) 80%,transparent);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.lily{position:absolute; pointer-events:none; animation:sway 6s ease-in-out infinite alternate}
.lily .p{transform-box:fill-box; transform-origin:50% 100%; transform:scale(0); animation:bloom 1.4s cubic-bezier(.2,.9,.3,1.2) forwards}
.lily .leaf{transform-box:fill-box; transform-origin:0 100%; transform:scale(0); animation:bloom 1.2s ease-out forwards}
@keyframes bloom{to{transform:scale(1)}}
@keyframes sway{from{rotate:-4deg}to{rotate:4deg}}
.l1{top:-34px; left:-34px; width:170px; animation-delay:0s}
.l2{top:-20px; right:-40px; width:140px}
.l3{bottom:-34px; left:-40px; width:110px}
.l4{bottom:-30px; right:-36px; width:110px}
.fall{position:absolute; top:-30px; width:16px; opacity:.8; animation:fall linear infinite; pointer-events:none}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0)}
  100%{transform:translate(40px,680px) rotate(300deg)}
}
h1{
  font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:500;
  font-size:clamp(30px,8vw,40px); line-height:1.12; margin:0 0 8px;
  opacity:0; animation:rise 1.2s 2.2s ease-out forwards;
}
.sub{color:var(--soft); font-weight:600; margin:0 0 14px; opacity:0; animation:rise 1s 2.6s ease-out forwards}
.msg{font-size:17px; line-height:1.5; max-width:34ch; margin:0 auto 14px; opacity:0; animation:rise 1s 3s ease-out forwards}
.sign{font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:20px; opacity:0; animation:rise 1s 3.4s ease-out forwards}
[contenteditable]{border-bottom:1.5px dashed var(--paw); padding:0 4px; outline:none; cursor:text}
[contenteditable]:focus-visible{outline:2px solid var(--paw); outline-offset:3px; border-radius:4px}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
.trail{position:absolute; left:0; right:0; bottom:26px; height:70px}
.paw{position:absolute; width:30px; fill:#fff; filter:drop-shadow(0 1px 3px rgba(90,40,110,.55)); opacity:0; animation:step .6s ease-out forwards}
@keyframes step{from{opacity:0; scale:.4}to{opacity:.75; scale:1}}
button{
  position:absolute; right:14px; bottom:12px; font:inherit; font-size:13px; font-weight:600;
  color:var(--soft); background:none; border:1.5px solid var(--paw); border-radius:999px;
  padding:6px 14px; cursor:pointer; z-index:2;
}
button:hover{background:var(--paw); color:#fff}
button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important}
  .fall{display:none}
}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="panel">
  <h1>Happy 2 years, friend!</h1>
  <p class="sub">Two years of friendship</p>
  <p class="msg">Thank you for this friendship, twin.</p>
  <p class="sign" aria-hidden="true">(◕‿◕✿) 🐾 🌷 🐾 (✿◕‿◕)</p>
  </div>
  <div class="trail" id="trail" aria-hidden="true"></div>
  <button id="replay" type="button">Replay</button>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="paw" viewBox="0 0 100 100">
      <path d="M50 52c-14 0-26 12-26 22 0 9 8 12 15 10 5-1 8-3 11-3s6 2 11 3c7 2 15-1 15-10 0-10-12-22-26-22z"/>
      <ellipse cx="20" cy="46" rx="8" ry="11" transform="rotate(-22 20 46)"/>
      <ellipse cx="39" cy="27" rx="8" ry="12" transform="rotate(-6 39 27)"/>
      <ellipse cx="61" cy="27" rx="8" ry="12" transform="rotate(6 61 27)"/>
      <ellipse cx="80" cy="46" rx="8" ry="11" transform="rotate(22 80 46)"/>
    </symbol>
  </defs>
</svg>

<script>
const card = document.getElementById('card');
const trail = document.getElementById('trail');

function lily(cls, delay, flip){
  let petals = '';
  for(let i=0;i<6;i++){
    petals += `<g transform="rotate(${i*60+(i%2?8:0)})"><path class="p" style="animation-delay:${delay+0.5+i*0.18}s" d="M0 0C15 -22 15 -54 0 -72C-15 -54 -15 -22 0 0Z" fill="var(--petal)" stroke="var(--petal-edge)" stroke-width="2"/><path class="p" style="animation-delay:${delay+0.7+i*0.18}s" d="M0 -8L0 -50" stroke="var(--petal-edge)" stroke-width="1.5" fill="none"/></g>`;
  }
  let dots = '';
  for(let i=0;i<6;i++){
    const a = i*60+30, x = Math.sin(a*Math.PI/180)*20, y = -Math.cos(a*Math.PI/180)*20;
    dots += `<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="var(--leaf)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="3.5" fill="var(--stamen)"/>`;
  }
  const el = document.createElement('div');
  el.className = 'lily ' + cls;
  el.innerHTML = `<svg viewBox="-80 -80 160 160" width="100%" style="${flip?'transform:scaleX(-1)':''}">
    <g class="leaf" style="animation-delay:${delay}s"><path d="M0 0C30 20 60 20 78 40C50 46 18 32 0 0Z" fill="var(--leaf)"/></g>
    ${petals}${dots}</svg>`;
  card.appendChild(el);
}
function build(){
  card.querySelectorAll('.lily,.fall').forEach(e=>e.remove());
  trail.innerHTML = '';
  lily('l1', 0.1, false); lily('l2', 0.4, true); lily('l3', 0.8, false); lily('l4', 1.1, true);
  for(let i=0;i<7;i++){
    const w = card.clientWidth, x = 20 + i*((w-90)/6), up = i%2 ? 34 : 4;
    const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('class','paw'); s.setAttribute('viewBox','0 0 100 100');
    s.style.left = x+'px'; s.style.top = up+'px';
    s.style.rotate = '90deg'; s.style.animationDelay = (1.4 + i*0.35)+'s';
    s.innerHTML = '<use href="#paw"/>';
    trail.appendChild(s);
  }
  for(let i=0;i<6;i++){
    const f = document.createElementNS('http://www.w3.org/2000/svg','svg');
    f.setAttribute('class','fall'); f.setAttribute('viewBox','-12 -20 24 24');
    f.style.left = (8+i*16)+'%'; f.style.animationDuration = (11+i*1.7)+'s'; f.style.animationDelay = (4+i*1.6)+'s';
    f.innerHTML = '<path d="M0 0C6 -6 6 -14 0 -18C-6 -14 -6 -6 0 0Z" fill="var(--petal)" stroke="var(--petal-edge)" stroke-width="1.2"/>';
    card.appendChild(f);
  }
}
build();
document.getElementById('replay').addEventListener('click', ()=>{
  card.querySelectorAll('h1,.sub,.msg,.sign,.rb,.ham').forEach(e=>{e.style.animation='none'; e.offsetHeight; e.style.animation='';});
  build();
});
</script>
</body>
</html>
